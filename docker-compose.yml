services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gaint_interns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/gaint_interns
      JWT_SECRET: change-me-in-production
      PORT: 8000
      FRONTEND_URL: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {pgdata: {}}
