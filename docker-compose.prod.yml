# Production stack. Run with:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Copy deploy/production.env.example to .env.production and fill it in first.
# Only Caddy publishes ports (80/443). The database, API, verifier and virus scanner stay on the
# private Compose network.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gaint_interns}
      POSTGRES_USER: ${POSTGRES_USER:-gaint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      # The first start downloads virus signatures, which takes a few minutes.
      start_period: 300s

  biometric:
    build: ./biometric-verifier
    restart: unless-stopped
    environment:
      BIOMETRIC_VERIFY_TOKEN: ${BIOMETRIC_VERIFY_TOKEN:?BIOMETRIC_VERIFY_TOKEN is required}
      BIOMETRIC_VERIFY_HOST: 0.0.0.0
      BIOMETRIC_VERIFY_PORT: 8765

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-gaint}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-gaint_interns}
      FRONTEND_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      PQ_REQUIRE_HYBRID_TOKENS: "true"
      # Test-server only: accepts 000000 as the staff MFA code. Set to false before real users join.
      ALLOW_TEST_MFA_CODE: ${ALLOW_TEST_MFA_CODE:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?FILE_ENCRYPTION_KEY is required}
      FILE_ENCRYPTION_KEY_ID: ${FILE_ENCRYPTION_KEY_ID:-primary}
      FILE_ENCRYPTION_PREVIOUS_KEYS: ${FILE_ENCRYPTION_PREVIOUS_KEYS:-}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      BIOMETRIC_VERIFY_URL: http://biometric:8765/verify
      BIOMETRIC_VERIFY_TOKEN: ${BIOMETRIC_VERIFY_TOKEN:?BIOMETRIC_VERIFY_TOKEN is required}
      BIOMETRIC_AUTO_START: "false"
      BIOMETRIC_MATCH_THRESHOLD: ${BIOMETRIC_MATCH_THRESHOLD:-0.6}
      BIOMETRIC_ANTISPOOF_THRESHOLD: ${BIOMETRIC_ANTISPOOF_THRESHOLD:-}
      PROOF_RETENTION_DAYS: ${PROOF_RETENTION_DAYS:-365}
      FACE_RETENTION_DAYS: ${FACE_RETENTION_DAYS:-90}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      ATTENDANCE_MAX_RETRIES: ${ATTENDANCE_MAX_RETRIES:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
      GROQ_MAX_GENERATION_QUESTIONS: ${GROQ_MAX_GENERATION_QUESTIONS:-30}
      AI_GENERATION_RATE_LIMIT: ${AI_GENERATION_RATE_LIMIT:-20}
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      biometric:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time; the API is served from the same domain.
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  clamav:
  caddy_data:
  caddy_config:
