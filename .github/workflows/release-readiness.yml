name: Release readiness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  backend:
    name: Backend tests with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: intern
          POSTGRES_PASSWORD: intern_ci_password
          POSTGRES_DB: intern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intern -d intern_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://intern:intern_ci_password@localhost:5432/intern_test
      JWT_SECRET: ci-only-assessment-test-secret
      RUN_DB_E2E: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=/api -t gaint-skillbridge-frontend:ci ./frontend
      - run: docker build -t gaint-skillbridge-backend:ci ./backend
